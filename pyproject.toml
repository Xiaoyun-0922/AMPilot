[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampilot"
version = "0.1.0"
description = "Antimicrobial Peptide Research Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AMPilot Team"},
]

dependencies = [
    "langchain>=0.3.26",
    "langchain-core>=0.3.66",
    "langchain-community>=0.3.26",
    "langchain-text-splitters>=0.3.8",
    "openai>=1.90.0",
    "sentence-transformers>=5.0.0",
    "pandas>=2.3.0",
    "tqdm>=4.66.4",
    "python-dotenv>=1.1.1",
    "weaviate-client>=4.16.9",
    "langgraph>=0.6.6",
    "weaviate>=0.1.2",
    "langchain-huggingface>=0.3.1",
    "langchain-openai>=0.3.32",
    "fastmcp>=2.12.0",
    "pytest>=8.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
]

[project.scripts]
ampilot = "backend.agentic_rag.main:main"
ingest = "backend.agentic_rag.ingest:main"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest]
testpaths = ["tests"]
python_files = "test_*.py"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
]
